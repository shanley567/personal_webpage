<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f8f8f8;
            border-bottom: 1px solid #ddd;
        }
        header img {
            height: 100px;
            margin-bottom: 10px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        main {
            display: flex;
            flex: 1;
            background-color: #f0f0f0;
        }
        .sidebar {
            width: 200px;
            background-color: #333;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .sidebar button {
            padding: 15px;
            background: none;
            border: none;
            color: white;
            text-align: left;
            width: 100%;
            cursor: pointer;
            border-bottom: 1px solid #444;
            font-size: 16px;
        }
        .sidebar button:hover {
            background-color: #575757;
        }
        .content {
            flex: 1;
            padding: 20px;
            background-color: white;
        }
        .content > div {
            display: none;
        }
        .content > div.active {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <img src="profile.jpeg" alt="Logo">
        <h1>James Shanley Pratt</h1>
    </header>
    <main>
        <div class="sidebar">
            <button onclick="showContent('content1')">About Me</button>
            <button onclick="showContent('content2')">Qualifications</button>
            <button onclick="showContent('content3')">Work Experience</button>
            <button onclick="showContent('content4')">CV</button>
        </div>
        <div class="content">
            <div id="content1" class="active">
                <h2>About Me</h2>
                <p>This is the content for the About Me section.</p>
            </div>
            <div id="content2">
                <h2>Qualifications</h2>
                <p>This is the content for the Qualifications section.</p>
            </div>
            <div id="content3">
                <h2>Work Experience</h2>
                <p>This is the content for the Work Experience section.</p>
            </div>
            <div id="content4">
                <h2>CV</h2>
                  <!-- Button to open PDF in a new tab -->
                  <a href="CV.pdf" target="_blank" class="pdf-button">Open CV in new tab</a>
                  <br>
                  <br>
                  <!-- Button to download PDF -->
                  <a href="CV.pdf" download="James Shanley Pratt CV.pdf" class="download-button">Download PDF</a>
            </div>
        </div>
    </main>
    <script>
        function showContent(contentId) {
            var contents = document.querySelectorAll('.content > div');
            contents.forEach(content => content.classList.remove('active'));
            document.getElementById(contentId).classList.add('active');
        }
    </script>
</body>
</html>
